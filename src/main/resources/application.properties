spring.application.name=bff

# Azure B2C Configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH_RESOURCESERVER_JWT_JWT_SET_URI}

# Server y CORS
server.port=8084
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# APIs
api.doctors=${API_DOCTORS}
api.patient=${API_PATIENT}

# Log
logging.file.name=./logs/cloudnative.bff.log
logging.level.root=INFO
logging.level.org.springframework=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2.jwt=DEBUG
logging.level.org.hibernate=DEBUG
